[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyso-md"
version = "0.2.0"
description = "Restartable FASTA-to-MD pipeline scaffolding for holo human lysozyme C designs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "lyso-md maintainers"}]
dependencies = [
  "PyYAML>=6.0,<7",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "jinja2>=3.1,<4",
  "rdkit>=2024.3",
  "gemmi>=0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lyso-md = "lyso_md.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
